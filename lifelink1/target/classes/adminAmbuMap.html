</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /*
     * =========================================================
     * GLOBAL VARIABLES
     * =========================================================
     */

    L.Browser.any3d = false;

    let map = null;

    let destMarker = null;
    let ambulanceMarker = null;

    let corridorCasing = null;
    let corridorCore = null;

    let routeCoords = [];

    let mapInitialized = false;

    let pendingRoute = null;


    /*
     * =========================================================
     * ICONS
     * =========================================================
     */

    const ambIcon = L.divIcon({
        className: '',
        html: '<div class="marker-amb">🚑</div>',
        iconSize: [38, 38],
        iconAnchor: [19, 19]
    });


    const destIcon = L.divIcon({
        className: '',
        html: '<div class="marker-dest-pin">🏥</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
    });


    /*
     * =========================================================
     * INITIALIZE MAP
     * =========================================================
     */

    function initMap() {

        if (map) {
            mapInitialized = true;
            return;
        }

        console.log("Initializing Leaflet map...");

        map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            zoomAnimation: false,
            fadeAnimation: false
        }).setView(
            [18.4800, 73.8600],
            13
        );


        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                tileSize: 256
            }
        ).addTo(map);


        const resizeObserver =
            new ResizeObserver(() => {

                if (map) {
                    map.invalidateSize(true);
                }

            });


        resizeObserver.observe(
            document.getElementById('map')
        );


        mapInitialized = true;

        console.log("Leaflet map initialized.");


        /*
         * If Java called the route function before
         * the map was ready, process it now.
         */

        if (pendingRoute !== null) {

            const route = pendingRoute;

            pendingRoute = null;

            console.log(
                "Processing pending ambulance route."
            );

            setRouteFromCurrentLocation(
                route.lat,
                route.lng,
                route.destination
            );
        }
    }


    /*
     * =========================================================
     * GEOCODE LOCATION
     * =========================================================
     */

    async function geocodeLocation(nameStr) {

        if (!nameStr) {

            return {
                lat: 18.5018,
                lng: 73.8636,
                name: "Unknown"
            };
        }


        const query =
            String(nameStr).trim().toLowerCase();


        /*
         * KATRAJ
         */

        if (query.includes("katraj")) {

            return {
                lat: 18.4575,
                lng: 73.8677,
                name: "Katraj"
            };
        }


        /*
         * SWARGATE
         */

        if (query.includes("swargate")) {

            return {
                lat: 18.5018,
                lng: 73.8636,
                name: "Swargate"
            };
        }


        /*
         * CORE2WEB / NARHE
         */

        if (
            query.includes("core2web") ||
            query.includes("narhe")
        ) {

            return {
                lat: 18.4852,
                lng: 73.8166,
                name: "Core2Web"
            };
        }


        /*
         * RUBY HALL / SASSOON
         */

        if (
            query.includes("ruby") ||
            query.includes("sassoon")
        ) {

            return {
                lat: 18.5308,
                lng: 73.8778,
                name: "Ruby Hall Clinic"
            };
        }


        /*
         * HADAPSAR / NOBEL
         */

        if (
            query.includes("hadapsar") ||
            query.includes("nobel")
        ) {

            return {
                lat: 18.5089,
                lng: 73.9259,
                name: "Nobel Hospital"
            };
        }


        /*
         * KEM HOSPITAL
         */

        if (query.includes("kem")) {

            return {
                lat: 18.5204,
                lng: 73.8720,
                name: "KEM Hospital Pune"
            };
        }


        /*
         * OPENSTREETMAP FALLBACK
         */

        const url =
            'https://nominatim.openstreetmap.org/search?format=json&countrycodes=in&limit=1&q=' +
            encodeURIComponent(
                String(nameStr) + ", Pune"
            );


        try {

            const res =
                await fetch(url);


            const data =
                await res.json();


            if (
                data &&
                data.length > 0
            ) {

                return {
                    lat:
                        parseFloat(
                            data[0].lat
                        ),

                    lng:
                        parseFloat(
                            data[0].lon
                        ),

                    name:
                        data[0]
                            .display_name
                            .split(',')[0]
                };
            }

        }
        catch (e) {

            console.log(
                "Geocoding failed:",
                e
            );
        }


        return {
            lat: 18.5018,
            lng: 73.8636,
            name: nameStr
        };
    }


    /*
     * =========================================================
     * MAIN ROUTE FUNCTION
     *
     * IMPORTANT:
     * JavaFX WebEngine calls this function.
     *
     * DO NOT REMOVE.
     * =========================================================
     */

    async function setRouteFromCurrentLocation(
        currLat,
        currLng,
        destName
    ) {

        console.log(
            "===================================="
        );

        console.log(
            "setRouteFromCurrentLocation() called"
        );

        console.log(
            "Ambulance Latitude:",
            currLat
        );

        console.log(
            "Ambulance Longitude:",
            currLng
        );

        console.log(
            "Hospital:",
            destName
        );


        /*
         * Convert Java values to numbers.
         */

        currLat =
            Number(currLat);

        currLng =
            Number(currLng);


        /*
         * Validate coordinates.
         */

        if (
            Number.isNaN(currLat) ||
            Number.isNaN(currLng)
        ) {

            console.log(
                "ERROR: Invalid ambulance coordinates."
            );

            return;
        }


        /*
         * If map is not ready yet,
         * store the request.
         */

        if (!mapInitialized || !map) {

            console.log(
                "Map is not ready. Storing route request."
            );

            pendingRoute = {
                lat: currLat,
                lng: currLng,
                destination: destName
            };

            return;
        }


        /*
         * Make sure Leaflet knows the
         * current WebView size.
         */

        map.invalidateSize(true);


        /*
         * Find destination hospital.
         */

        const destLoc =
            await geocodeLocation(
                destName
            );


        console.log(
            "Hospital coordinates:",
            destLoc.lat,
            destLoc.lng
        );


        /*
         * =====================================================
         * REMOVE OLD MARKERS
         * =====================================================
         */

        if (destMarker) {

            map.removeLayer(
                destMarker
            );

            destMarker = null;
        }


        if (ambulanceMarker) {

            map.removeLayer(
                ambulanceMarker
            );

            ambulanceMarker = null;
        }


        if (corridorCasing) {

            map.removeLayer(
                corridorCasing
            );

            corridorCasing = null;
        }


        if (corridorCore) {

            map.removeLayer(
                corridorCore
            );

            corridorCore = null;
        }


        /*
         * =====================================================
         * AMBULANCE MARKER
         * =====================================================
         */

        ambulanceMarker =
            L.marker(
                [
                    currLat,
                    currLng
                ],
                {
                    icon: ambIcon,
                    zIndexOffset: 3000
                }
            )
            .addTo(map)
            .bindTooltip(
                "🚑 Ambulance (Live Location)",
                {
                    permanent: true,
                    direction: "top",
                    className: "badge-pickup",
                    offset: [0, -14]
                }
            );


        console.log(
            "Ambulance marker added."
        );


        /*
         * =====================================================
         * HOSPITAL MARKER
         * =====================================================
         */

        destMarker =
            L.marker(
                [
                    destLoc.lat,
                    destLoc.lng
                ],
                {
                    icon: destIcon
                }
            )
            .addTo(map)
            .bindTooltip(
                "🏥 " + destName,
                {
                    permanent: true,
                    direction: "top",
                    className: "badge-destination",
                    offset: [0, -16]
                }
            );


        console.log(
            "Hospital marker added."
        );


        /*
         * =====================================================
         * OSRM ROUTING
         * =====================================================
         */

        const url =
            'https://router.project-osrm.org/route/v1/driving/' +
            currLng +
            ',' +
            currLat +
            ';' +
            destLoc.lng +
            ',' +
            destLoc.lat +
            '?overview=full&geometries=geojson';


        try {

            console.log(
                "Requesting OSRM route..."
            );


            const res =
                await fetch(url);


            const data =
                await res.json();


            if (
                data.routes &&
                data.routes.length > 0
            ) {

                const route =
                    data.routes[0];


                routeCoords =
                    route.geometry.coordinates
                        .map(
                            p => [
                                p[1],
                                p[0]
                            ]
                        );


                /*
                 * Outer route line
                 */

                corridorCasing =
                    L.polyline(
                        routeCoords,
                        {
                            color: '#065f46',
                            weight: 8,
                            opacity: 0.85
                        }
                    )
                    .addTo(map);


                /*
                 * Inner route line
                 */

                corridorCore =
                    L.polyline(
                        routeCoords,
                        {
                            color: '#22c55e',
                            weight: 4.5,
                            opacity: 1.0
                        }
                    )
                    .addTo(map);


                /*
                 * Fit entire route into map.
                 */

                map.fitBounds(
                    L.latLngBounds(
                        routeCoords
                    ),
                    {
                        paddingTopLeft: [30, 60],
                        paddingBottomRight: [30, 60]
                    }
                );


                console.log(
                    "Route added successfully."
                );

            }
            else {

                console.log(
                    "No OSRM route found."
                );


                map.fitBounds(
                    [
                        [
                            currLat,
                            currLng
                        ],
                        [
                            destLoc.lat,
                            destLoc.lng
                        ]
                    ],
                    {
                        padding: [40, 40]
                    }
                );
            }

        }
        catch (err) {

            console.log(
                "OSRM routing failed:",
                err
            );


            /*
             * Even if OSRM fails,
             * show both locations.
             */

            map.fitBounds(
                [
                    [
                        currLat,
                        currLng
                    ],
                    [
                        destLoc.lat,
                        destLoc.lng
                    ]
                ],
                {
                    padding: [40, 40]
                }
            );
        }


        /*
         * Final map resize.
         */

        setTimeout(
            () => {

                if (map) {

                    map.invalidateSize(
                        true
                    );
                }

            },
            150
        );


        console.log(
            "===================================="
        );
    }




    
     
    
    


    async function setRouteFromSourceToDestination(sourceName, destName) {

    console.log(
        "===================================="
    );

    console.log(
        "setRouteFromSourceToDestination() called"
    );

    console.log(
        "Pickup:",
        sourceName
    );

    console.log(
        "Hospital:",
        destName
    );


    /*
     * If map is not ready yet,
     * wait until it is initialized.
     */

    if (!mapInitialized || !map) {

        console.log(
            "Map is not ready yet."
        );

        return;
    }


    /*
     * Make sure Leaflet knows the
     * current WebView size.
     */

    map.invalidateSize(true);


    /*
     * Find pickup location.
     */

    const sourceLoc =
        await geocodeLocation(
            sourceName
        );


    /*
     * Find destination hospital.
     */

    const destLoc =
        await geocodeLocation(
            destName
        );


    console.log(
        "Pickup coordinates:",
        sourceLoc.lat,
        sourceLoc.lng
    );

    console.log(
        "Hospital coordinates:",
        destLoc.lat,
        destLoc.lng
    );


    /*
     * =====================================================
     * REMOVE OLD MARKERS AND ROUTE
     * =====================================================
     */

    if (destMarker) {

        map.removeLayer(
            destMarker
        );

        destMarker = null;
    }


    if (ambulanceMarker) {

        map.removeLayer(
            ambulanceMarker
        );

        ambulanceMarker = null;
    }


    if (corridorCasing) {

        map.removeLayer(
            corridorCasing
        );

        corridorCasing = null;
    }


    if (corridorCore) {

        map.removeLayer(
            corridorCore
        );

        corridorCore = null;
    }


    /*
     * =====================================================
     * PICKUP / AMBULANCE MARKER
     * =====================================================
     */

    ambulanceMarker =
        L.marker(
            [
                sourceLoc.lat,
                sourceLoc.lng
            ],
            {
                icon: ambIcon,
                zIndexOffset: 3000
            }
        )
        .addTo(map)
        .bindTooltip(
            "🚑 Pickup: " + sourceLoc.name,
            {
                permanent: true,
                direction: "top",
                className: "badge-pickup",
                offset: [0, -14]
            }
        );


    console.log(
        "Pickup marker added."
    );


    /*
     * =====================================================
     * HOSPITAL MARKER
     * =====================================================
     */

    destMarker =
        L.marker(
            [
                destLoc.lat,
                destLoc.lng
            ],
            {
                icon: destIcon
            }
        )
        .addTo(map)
        .bindTooltip(
            "🏥 " + destLoc.name,
            {
                permanent: true,
                direction: "top",
                className: "badge-destination",
                offset: [0, -16]
            }
        );


    console.log(
        "Hospital marker added."
    );


    /*
     * =====================================================
     * OSRM ROUTING
     * =====================================================
     */

    const url =
        'https://router.project-osrm.org/route/v1/driving/' +
        sourceLoc.lng +
        ',' +
        sourceLoc.lat +
        ';' +
        destLoc.lng +
        ',' +
        destLoc.lat +
        '?overview=full&geometries=geojson';


    try {

        console.log(
            "Requesting route from pickup to hospital..."
        );


        const res =
            await fetch(url);


        const data =
            await res.json();


        /*
         * =================================================
         * ROUTE FOUND
         * =================================================
         */

        if (
            data.routes &&
            data.routes.length > 0
        ) {

            const route =
                data.routes[0];


            routeCoords =
                route.geometry.coordinates
                    .map(
                        p => [
                            p[1],
                            p[0]
                        ]
                    );


            /*
             * Outer route line
             */

            corridorCasing =
                L.polyline(
                    routeCoords,
                    {
                        color: '#065f46',
                        weight: 8,
                        opacity: 0.85
                    }
                )
                .addTo(map);


            /*
             * Inner route line
             */

            corridorCore =
                L.polyline(
                    routeCoords,
                    {
                        color: '#22c55e',
                        weight: 4.5,
                        opacity: 1.0
                    }
                )
                .addTo(map);


            /*
             * Fit complete route into map.
             */

            map.fitBounds(
                L.latLngBounds(
                    routeCoords
                ),
                {
                    padding: [40, 40]
                }
            );


            console.log(
                "Pickup → Hospital route added successfully."
            );

        }

        /*
         * =================================================
         * NO ROUTE FOUND
         * =================================================
         */

        else {

            console.log(
                "No OSRM route found."
            );


            map.fitBounds(
                [
                    [
                        sourceLoc.lat,
                        sourceLoc.lng
                    ],
                    [
                        destLoc.lat,
                        destLoc.lng
                    ]
                ],
                {
                    padding: [40, 40]
                }
            );
        }

    }

    catch (err) {

        console.log(
            "OSRM routing failed:",
            err
        );


        /*
         * Even if routing fails,
         * show both locations.
         */

        map.fitBounds(
            [
                [
                    sourceLoc.lat,
                    sourceLoc.lng
                ],
                [
                    destLoc.lat,
                    destLoc.lng
                ]
            ],
            {
                padding: [40, 40]
            }
        );
    }


    /*
     * Final map resize.
     */

    setTimeout(
        () => {

            if (map) {

                map.invalidateSize(
                    true
                );
            }

        },
        150
    );


    console.log(
        "===================================="
    );
}

    window.setRouteFromCurrentLocation = setRouteFromCurrentLocation;

    window.setRouteFromSourceToDestination = setRouteFromSourceToDestination;


    /*
     * =========================================================
     * PAGE LOAD
     * =========================================================
     */

    window.onload =
        function () {

            console.log(
                "driver_map.html fully loaded."
            );


            initMap();


            console.log(
                "setRouteFromCurrentLocation available:",
                typeof window.setRouteFromCurrentLocation
            );


            /*
             * This should print:
             *
             * function
             */

            if (
                typeof window.setRouteFromCurrentLocation
                === "function"
            ) {

                console.log(
                    "SUCCESS: JavaFX route function is available."
                );

            }
            else {

                console.log(
                    "ERROR: JavaFX route function is NOT available."
                );
            }
        };

</script>
